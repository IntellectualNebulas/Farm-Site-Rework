        <div class = "main">

            <div class="split-text-container">

                <span class="text-part left">Our </span>
                <span class="text-part right">Shop </span>

            </div>

        <div class = "box">

            <p>Just next to our cafe, we have our farm shop. Where you can buy freshly made products made here on the farm!</p>

        </div>

        <div class="box">

            <p>Here is a list of our products in stock at the moment:</p>

            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Price</th>
                    </tr>
                </thead>

                <tbody id="ShopTable">
                </tbody>
            </table>

            <script>
                

                async function loadShop() {
                    const response = await fetch("http://127.0.0.1:5000/shop");
                    const data = await response.json();

                    const table = document.getElementById("ShopTable");

                    data.ShopItem.forEach((itemName, index) => {
                        const row = document.createElement("tr");

                        const itemCell = document.createElement("td");
                        itemCell.textContent = itemName;

                        const priceCell = document.createElement("td");
                        priceCell.textContent = data.ShopPrice[index];

                        row.appendChild(itemCell);
                        row.appendChild(priceCell);

                        table.appendChild(row);
                    });
                }

                loadShop();

            </script>

        </div>

    </body>
