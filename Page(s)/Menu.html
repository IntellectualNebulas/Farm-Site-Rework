        <div class = "main">

            <div class="split-text-container">

                <span class="text-part left">Our </span>
                <span class="text-part right">Menu </span>

            </div>

        <div class="box">

            <ul id="ItemName"></ul>
            <ul id="ItemPrice"></ul>

            <script>

                async function loadMenu() {
                    const response = await fetch("http://127.0.0.1:5000/menu");
                    const data = await response.json();

                    const list = document.getElementById("ItemName");

                    data.Foodname.forEach(ItemName => {
                        const item = document.createElement("li");
                        item.textContent = ItemName;
                        list.appendChild(item);
                    });
                }

                loadMenu();

            </script>

            <script>

                async function loadPrice() {
                    const response = await fetch("http://127.0.0.1:5000/menu");
                    const data = await response.json();

                    const list = document.getElementById("ItemName");

                    data.Drinks.forEach(ItemName => {
                        const item = document.createElement("li");
                        item.textContent = ItemName;
                        list.appendChild(item);
                    });
                }

                loadPrice();

            </script>

        </div>

    </body>
