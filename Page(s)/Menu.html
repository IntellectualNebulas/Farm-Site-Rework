        <div class = "main">

            <div class="split-text-container">

                <span class="text-part left">Our </span>
                <span class="text-part right">Menu </span>

            </div>

        <div class="box">

            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Price</th>
                    </tr>
                </thead>

                <tbody id="MenuTable">
                </tbody>
            </table>

            <script>

                async function loadMenu() {
                    const response = await fetch("http://127.0.0.1:5000/menu");
                    const data = await response.json();

                    const table = document.getElementById("MenuTable");

                    data.Foodname.forEach((itemName, index) => {
                        const row = document.createElement("tr");

                        const itemCell = document.createElement("td");
                        itemCell.textContent = itemName;

                        const priceCell = document.createElement("td");
                        priceCell.textContent = data.Drinks[index];

                        row.appendChild(itemCell);
                        row.appendChild(priceCell);

                        table.appendChild(row);
                    });
                }

                loadMenu();

            </script>

        </div>

        <br>

    </body>
